<style>
  :root{
    --bg:#0f1117; --card:#1a1d29; --accent:#4f8cff; --accent2:#33d69f;
    --text:#e8eaf0; --muted:#8a8fa3; --danger:#ff5c7a; --border:#2a2e3d; --warn:#ffb84f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:70px;}
  header{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header h1{margin:0;font-size:1.25rem;}
  header .sub{color:var(--muted);font-size:.78rem;}
  #installBtn{display:none;background:var(--accent2);border:none;color:#08120d;font-weight:700;
    padding:8px 14px;border-radius:20px;font-size:.78rem;cursor:pointer;}
  .phase-banner{margin:0 18px 12px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,#1b2440,#1a1d29);
    border:1px solid var(--border);font-size:.82rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .phase-banner b{color:var(--accent);}
  .phase-select{background:#0d0f16;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.75rem;}
  main{max-width:820px;margin:0 auto;padding:0 14px 14px;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 16px;margin-bottom:14px;}
  .card h2{margin:0 0 6px;font-size:1.02rem;}
  .day-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;}
  .day-tabs button{flex:0 0 auto;background:#171a26;border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:20px;font-size:.78rem;cursor:pointer;white-space:nowrap;}
  .day-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .ex-card{border-left:3px solid var(--accent);}
  .ex-card.rest-day{border-left-color:var(--muted);}
  .ex-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ex-name{font-weight:700;font-size:1rem;}
  .superset-tag{display:inline-block;background:#3a2f52;color:#c9a8ff;font-size:.68rem;
    padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;}
  .target{color:var(--warn);font-size:.82rem;margin:4px 0 10px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .btn-sm{background:#22263a;border:1px solid var(--border);color:var(--text);padding:7px 12px;
    border-radius:8px;font-size:.78rem;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .btn-sm:hover{border-color:var(--accent);}
  .btn-sm.video{color:#ff8a8a;}
  .btn-sm.timer{color:var(--accent2);}
  .log-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .log-row input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
    background:#0d0f16;color:var(--text);font-size:.9rem;}
  .log-row span{font-size:.72rem;color:var(--muted);width:46px;flex:0 0 auto;}
  .save-btn{background:var(--accent);border:none;color:#fff;font-weight:600;cursor:pointer;
    padding:10px;border-radius:8px;font-size:.85rem;width:100%;margin-top:4px;}
  .mini-history{margin-top:10px;font-size:.78rem;color:var(--muted);}
  .mini-history table{width:100%;border-collapse:collapse;margin-top:4px;}
  .mini-history td,.mini-history th{padding:4px 4px;border-bottom:1px solid var(--border);}
  .mini-history th{color:var(--muted);font-weight:600;text-align:left;font-size:.68rem;text-transform:uppercase;}
  nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#12141d;border-top:1px solid var(--border);
    display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
  nav.bottom-nav button{flex:1;background:transparent;border:none;color:var(--muted);padding:10px 4px;
    font-size:.68rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav.bottom-nav button.active{color:var(--accent);}
  nav.bottom-nav .icon{font-size:1.2rem;}
  select,input{background:#0d0f16;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%;font-size:.9rem;}
  label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 4px;}
  .empty{color:var(--muted);font-style:italic;text-align:center;padding:20px 0;}
  .chart-wrap{background:#0d0f16;border-radius:10px;padding:12px;margin-top:10px;}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin-top:10px;}
  .stat-row div{background:#0d0f16;border-radius:8px;padding:8px 12px;flex:1;min-width:110px;text-align:center;}
  .stat-row b{display:block;font-size:1.05rem;color:var(--accent2);}

  /* Timer widget */
  #timerWidget{position:fixed;bottom:64px;left:0;right:0;background:#101322;border-top:1px solid var(--accent);
    display:none;align-items:center;justify-content:space-between;padding:10px 18px;z-index:30;gap:10px;}
  #timerWidget.show{display:flex;}
  #timerDisplay{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent2);}
  #timerWidget .tbtns{display:flex;gap:6px;}
  #timerWidget button{background:#22263a;border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;}

  /* Modal for video */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;
    justify-content:center;z-index:50;padding:14px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#0d0f16;border-radius:12px;padding:14px;max-width:600px;width:100%;}
  .modal-box iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;}
  .modal-close{background:var(--danger);border:none;color:#fff;padding:8px 14px;border-radius:8px;
    margin-top:10px;cursor:pointer;font-size:.82rem;width:100%;}
  .fallback-link{display:block;text-align:center;color:var(--accent);margin-top:8px;font-size:.85rem;text-decoration:none;}

  .exercise-list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
  .exercise-list-item:last-child{border-bottom:none;}
  .meta{font-size:.75rem;color:var(--muted);}
  .danger-btn{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:6px;
    padding:5px 10px;font-size:.72rem;cursor:pointer;}
  table.full{width:100%;border-collapse:collapse;font-size:.82rem;}
  table.full th,table.full td{padding:7px 5px;border-bottom:1px solid var(--border);text-align:left;}
  table.full th{color:var(--muted);font-size:.7rem;text-transform:uppercase;}
</style>
</head>
<body>

<header>
  <div>
    <h1>🏋️ Gym Tracker</h1>
    <div class="sub">3-Phase Upper/Lower Program</div>
  </div>
  <button id="installBtn">📲 Install App</button>
</header>

<div class="phase-banner">
  <div>Current phase: <b id="phaseLabel">—</b> <span id="phaseDates" class="meta"></span></div>
  <select id="phaseOverride" class="phase-select"></select>
</div>

<div class="day-tabs" id="dayTabs"></div>

<main>

  <!-- WORKOUT VIEW -->
  <section id="workout" class="view active">
    <div id="workoutList"></div>
  </section>

  <!-- PROGRESS VIEW -->
  <section id="progress" class="view">
    <div class="card">
      <h2>Exercise Progress</h2>
      <label>Select Exercise</label>
      <select id="progressExerciseSelect"></select>
      <div class="chart-wrap"><canvas id="progressChart" height="130"></canvas></div>
      <div class="stat-row" id="progressStats"></div>
    </div>
    <div class="card">
      <h2>Full History</h2>
      <div id="historyTableWrap"></div>
    </div>
  </section>

  <!-- MANAGE VIEW -->
  <section id="manage" class="view">
    <div class="card">
      <h2>Add Custom Exercise</h2>
      <label>Exercise Name</label>
      <input type="text" id="newExName" placeholder="e.g. Face Pulls">
      <label>Assign to Day</label>
      <select id="newExDay"></select>
      <label>Target (e.g. 3 sets x 10-12 reps)</label>
      <input type="text" id="newExTarget" placeholder="3 sets x 10-12 reps">
      <label>Default Rest (seconds)</label>
      <input type="number" id="newExRest" value="60">
      <button class="save-btn" id="addExBtn">Add Exercise</button>
    </div>
    <div class="card">
      <h2>All Exercises</h2>
      <div id="exerciseManageList"></div>
    </div>
    <div class="card">
      <button class="danger-btn" id="resetDataBtn" style="width:100%;padding:10px;">Reset All Logged Data</button>
    </div>
  </section>

</main>

<!-- Timer Widget -->
<div id="timerWidget">
  <div>
    <div id="timerDisplay">01:30</div>
    <div class="meta" id="timerLabel">Rest timer</div>
  </div>
  <div class="tbtns">
    <button id="timerMinus">-15s</button>
    <button id="timerStartPause">Start</button>
    <button id="timerPlus">+15s</button>
    <button id="timerClose">✕</button>
  </div>
</div>

<!-- Video Modal -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-box">
    <div id="videoContent"></div>
    <button class="modal-close" id="videoModalClose">Close</button>
  </div>
</div>

<nav class="bottom-nav">
  <button data-view="workout" class="active"><span class="icon">📋</span>Workout</button>
  <button data-view="progress"><span class="icon">📈</span>Progress</button>
  <button data-view="manage"><span class="icon">⚙️</span>Manage</button>
</nav>

<script>
/* ---------------- PROGRAM DATA ---------------- */
const PHASES = [
  { id:1, label:"Phase 1: Volume & Base", start:"2026-08-25", end:"2026-09-21" },
  { id:2, label:"Phase 2: Heavy Mechanical Tension", start:"2026-09-22", end:"2026-10-19" },
  { id:3, label:"Phase 3: Peak Intensity & Density", start:"2026-10-20", end:"2026-11-16" }
];

const DAYS = [
  { key:"upperB", label:"Upper B", weekday:1 },
  { key:"lowerA", label:"Lower A + Abs", weekday:2 },
  { key:"rest1", label:"Rest", weekday:3, rest:true },
  { key:"upperA", label:"Upper A", weekday:4 },
  { key:"lowerB", label:"Lower B + Abs", weekday:5 },
  { key:"rest2", label:"Rest", weekday:6, rest:true },
  { key:"rest3", label:"Rest", weekday:0, rest:true }
];

function yt(id){ return `https://www.youtube.com/embed/${id}`; }
function ytSearch(q){ return `https://www.youtube.com/results?search_query=${encodeURIComponent(q+' form tutorial')}`; }

const BASE_EXERCISES = [
  // LOWER A (Tuesday)
  { id:"squat", name:"Barbell Back Squat", day:"lowerA", rest:150, videoId:"8YAarf_tr54",
    targets:{1:"4 sets x 6-8 reps (2 reps in reserve)",2:"4 sets x 5 reps (RPE 8.5)",3:"1 top set x 3-5 reps, then 3 backoff sets x 6 reps"} },
  { id:"rdl", name:"Romanian Deadlift", day:"lowerA", rest:120, videoId:"5bJEigM5iVg",
    targets:{1:"3 sets x 8-10 reps",2:"3 sets x 6-8 reps, 3s lowering phase",3:"3 sets x 6-8 reps, final set = 15s rest-pause"} },
  { id:"bss", name:"Bulgarian Split Squat / Leg Press", day:"lowerA", rest:90, searchQ:"bulgarian split squat",
    targets:{1:"3 sets x 10-12 reps per leg",2:"3 sets x 8-10 reps per leg",3:"3 sets x 8-10 reps per leg"} },
  { id:"calf1", name:"Standing Calf Raise", day:"lowerA", rest:60, superset:"Superset with Hanging Leg Raise", searchQ:"standing calf raise machine",
    targets:{1:"4 sets x 12-15 reps, 2s pause at bottom",2:"4 sets x 10-12 reps, 2s pause",3:"4 sets x 12-15 reps"} },
  { id:"hlr", name:"Hanging Leg Raise", day:"lowerA", rest:45, superset:"Superset with Standing Calf Raise", searchQ:"hanging leg raise",
    targets:{1:"3 sets x 12-15 reps",2:"4 sets x 12-15 reps",3:"4 sets x 15 reps"} },

  // UPPER A (Thursday)
  { id:"bench", name:"Flat Barbell Bench Press", day:"upperA", rest:120, videoId:"JY2PW3LhHtQ",
    targets:{1:"3-4 sets x 6-10 reps, straight sets",2:"3-4 sets x 6-10 reps, straight sets",3:"3-4 sets x 6-10 reps, straight sets"} },
  { id:"csr", name:"Chest Supported Row", day:"upperA", rest:120, searchQ:"chest supported row machine",
    targets:{1:"3 sets x 8-12 reps",2:"3 sets x 8-12 reps",3:"3 sets x 8-12 reps"} },
  { id:"ohp", name:"Seated Dumbbell Overhead Press", day:"upperA", rest:60, superset:"Superset with Lat Pulldown", searchQ:"seated dumbbell overhead press",
    targets:{1:"3 sets x 8-12 reps",2:"3 sets x 8-12 reps",3:"3 sets x 8-12 reps"} },
  { id:"latpull", name:"Lat Pulldown", day:"upperA", rest:60, superset:"Superset with Seated DB OHP", searchQ:"lat pulldown machine",
    targets:{1:"3 sets x 8-12 reps",2:"3 sets x 8-12 reps",3:"3 sets x 8-12 reps"} },
  { id:"bbcurl", name:"Barbell Bicep Curl", day:"upperA", rest:45, superset:"Superset with Tricep Pushdown", searchQ:"barbell bicep curl",
    targets:{1:"3 sets x 10-12 reps",2:"3 sets x 10-12 reps",3:"3 sets x 10-12 reps"} },
  { id:"triceppd", name:"Tricep Pushdown", day:"upperA", rest:45, superset:"Superset with Barbell Curl", searchQ:"tricep pushdown cable",
    targets:{1:"3 sets x 10-12 reps",2:"3 sets x 10-12 reps",3:"3 sets x 10-12 reps"} },

  // LOWER B (Friday)
  { id:"deadlift", name:"Deadlift (Conventional / Trap Bar)", day:"lowerB", rest:150, videoId:"VL5Ab0T07e4",
    targets:{1:"4 sets x 5 reps",2:"4 sets x 4 reps",3:"1 top set x 3 reps, then 2 backoff sets x 6 reps"} },
  { id:"vsquat", name:"Machine V Squat", day:"lowerB", rest:120, searchQ:"V squat machine",
    targets:{1:"3 sets x 8-10 reps, deep stretch, drive through midfoot",2:"4 sets x 6-8 reps, 3s lowering every rep",3:"3 sets x 6-8 reps, final set = 20% drop set to failure"} },
  { id:"legcurl", name:"Lying / Seated Hamstring Curl", day:"lowerB", rest:60, superset:"Superset with Leg Extension", searchQ:"seated leg curl machine",
    targets:{1:"3 sets x 10-12 reps",2:"3 sets x 8-10 reps, 3s lowering phase",3:"3 sets x 8-10 reps, rest-pause finish"} },
  { id:"legext", name:"Leg Extension", day:"lowerB", rest:45, superset:"Superset with Hamstring Curl", searchQ:"leg extension machine",
    targets:{1:"3 sets x 12-15 reps",2:"3 sets x 10-12 reps",3:"3 sets x 12-15 reps, double drop set finish"} },
  { id:"crunch", name:"Weighted Cable Crunch", day:"lowerB", rest:60, searchQ:"weighted cable crunch",
    targets:{1:"4 sets x 12-15 reps",2:"4 sets x 12-15 reps",3:"4 sets x 15 reps"} },

  // UPPER B (Monday)
  { id:"incline", name:"Incline Dumbbell Press", day:"upperB", rest:120, searchQ:"incline dumbbell press",
    targets:{1:"3-4 sets x 8-10 reps",2:"3-4 sets x 8-10 reps",3:"3-4 sets x 8-10 reps"} },
  { id:"pullup", name:"Pull Ups", day:"upperB", rest:120, videoId:"NIDEQeDydeU",
    targets:{1:"3 sets x 6-10 reps",2:"3 sets x 6-10 reps",3:"3 sets x 6-10 reps"} },
  { id:"scr", name:"Seated Cable Row", day:"upperB", rest:60, superset:"Superset with DB Lateral Raise", searchQ:"seated cable row",
    targets:{1:"3-4 sets x 10-12 reps",2:"3-4 sets x 10-12 reps",3:"3-4 sets x 10-12 reps"} },
  { id:"latraise", name:"Dumbbell Lateral Raise", day:"upperB", rest:60, superset:"Superset with Seated Cable Row", searchQ:"dumbbell lateral raise",
    targets:{1:"3-4 sets x 12-15 reps",2:"3-4 sets x 12-15 reps",3:"3-4 sets x 12-15 reps"} },
  { id:"inccurl", name:"Incline Dumbbell Bicep Curl", day:"upperB", rest:45, superset:"Superset with Overhead Tricep Ext.", searchQ:"incline dumbbell bicep curl",
    targets:{1:"3 sets x 10-12 reps",2:"3 sets x 10-12 reps",3:"3 sets x 10-12 reps"} },
  { id:"ohtricep", name:"Overhead Cable Tricep Extension", day:"upperB", rest:45, superset:"Superset with Incline Curl", searchQ:"overhead cable tricep extension",
    targets:{1:"3 sets x 10-12 reps",2:"3 sets x 10-12 reps",3:"3 sets x 10-12 reps"} }
];

/* ---------------- STORAGE ---------------- */
const STORAGE_KEY = "gymTrackerPWA_v1";
function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    const fresh = { customExercises: [], logs: {}, phaseOverride: null };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }
  try{ return JSON.parse(raw); }catch(e){ return { customExercises: [], logs: {}, phaseOverride: null }; }
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
let data = loadData();

function allExercises(){ return BASE_EXERCISES.concat(data.customExercises); }
function getExercise(id){ return allExercises().find(e=>e.id===id); }
function getLogs(id){ return data.logs[id] || []; }

/* ---------------- PHASE LOGIC ---------------- */
function getCurrentPhaseId(){
  if(data.phaseOverride) return data.phaseOverride;
  const today = new Date().toISOString().slice(0,10);
  for(const p of PHASES){ if(today >= p.start && today <= p.end) return p.id; }
  if(today < PHASES[0].start) return 1;
  return 3;
}
function renderPhaseBanner(){
  const pid = getCurrentPhaseId();
  const phase = PHASES.find(p=>p.id===pid);
  document.getElementById('phaseLabel').textContent = phase.label;
  document.getElementById('phaseDates').textContent = `(${phase.start} to ${phase.end})`;
  const sel = document.getElementById('phaseOverride');
  sel.innerHTML = `<option value="">Auto</option>` + PHASES.map(p=>`<option value="${p.id}">${p.label}</option>`).join('');
  sel.value = data.phaseOverride || "";
}
document.getElementById('phaseOverride').addEventListener('change', (e)=>{
  data.phaseOverride = e.target.value ? parseInt(e.target.value) : null;
  saveData();
  renderPhaseBanner();
  renderWorkoutView();
});

/* ---------------- NAV ---------------- */
document.querySelectorAll('.bottom-nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='progress') renderProgressView();
    if(btn.dataset.view==='manage') renderManageView();
  });
});

/* ---------------- DAY TABS ---------------- */
let selectedDayKey = (()=>{
  const todayWd = new Date().getDay();
  const d = DAYS.find(d=>d.weekday===todayWd);
  return d ? d.key : "lowerA";
})();

function renderDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = DAYS.filter(d=>!d.key.startsWith('rest') || d.key==='rest1').map(d=>{
    // collapse the 3 rest days into one tab labeled Rest, but keep unique day tabs for training days
    return '';
  }).join('');
  // simpler: unique tabs, merge rest days into single "Rest" tab
  const uniqueDays = [];
  const seenRest = false;
  const tabsData = [
    {key:"upperB", label:"Mon · Upper B"},
    {key:"lowerA", label:"Tue · Lower A"},
    {key:"rest", label:"Wed/Sat/Sun · Rest"},
    {key:"upperA", label:"Thu · Upper A"},
    {key:"lowerB", label:"Fri · Lower B"}
  ];
  wrap.innerHTML = tabsData.map(t=>`<button data-day="${t.key}" class="${selectedDayKey===t.key || (t.key==='rest' && selectedDayKey.startsWith('rest'))?'active':''}">${t.label}</button>`).join('');
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedDayKey = btn.dataset.day === 'rest' ? 'rest1' : btn.dataset.day;
      renderDayTabs();
      renderWorkoutView();
    });
  });
}

/* ---------------- WORKOUT VIEW ---------------- */
function renderWorkoutView(){
  const wrap = document.getElementById('workoutList');
  const dayKey = selectedDayKey.startsWith('rest') ? 'rest' : selectedDayKey;
  if(dayKey === 'rest'){
    wrap.innerHTML = `<div class="card ex-card rest-day"><h2>Rest Day 😌</h2><p class="meta">Active recovery: light walking, mobility work, or full rest. No lifting scheduled today.</p></div>`;
    return;
  }
  const pid = getCurrentPhaseId();
  const exs = allExercises().filter(e=>e.day===dayKey);
  if(exs.length===0){ wrap.innerHTML = '<div class="empty">No exercises assigned to this day yet.</div>'; return; }

  wrap.innerHTML = exs.map(ex=>{
    const target = ex.targets ? (ex.targets[pid] || ex.targets[1]) : (ex.target || '3 sets x 10-12 reps');
    const logs = getLogs(ex.id).slice(-3).reverse();
    const historyRows = logs.length ? logs.map(l=>`<tr><td>${l.date}</td><td>${l.weight} kg</td><td>${l.reps}</td></tr>`).join('') :
      `<tr><td colspan="3" class="empty" style="padding:6px 0;">No sets logged yet</td></tr>`;
    return `
    <div class="card ex-card" data-exid="${ex.id}">
      <div class="ex-header">
        <div>
          <span class="ex-name">${ex.name}</span>
          ${ex.superset ? `<span class="superset-tag">${ex.superset}</span>` : ''}
        </div>
      </div>
      <div class="target">🎯 ${target}</div>
      <div class="btn-row">
        <button class="btn-sm video" data-action="video" data-exid="${ex.id}">🎬 Watch tutorial</button>
        <button class="btn-sm timer" data-action="timer" data-exid="${ex.id}" data-rest="${ex.rest || 60}">⏱ Rest timer (${ex.rest || 60}s)</button>
      </div>
      <div class="log-row">
        <span>Set</span><input type="number" min="1" value="1" class="setNum" style="max-width:60px;">
        <span>Weight</span><input type="number" step="0.5" class="weightInput" placeholder="kg">
        <span>Reps</span><input type="number" class="repsInput" placeholder="reps">
      </div>
      <button class="save-btn" data-action="save" data-exid="${ex.id}">Save Set</button>
      <div class="mini-history">
        Last sessions:
        <table><tr><th>Date</th><th>Weight</th><th>Reps</th></tr>${historyRows}</table>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-action="video"]').forEach(b=>b.addEventListener('click', ()=>openVideo(b.dataset.exid)));
  wrap.querySelectorAll('[data-action="timer"]').forEach(b=>b.addEventListener('click', ()=>openTimer(parseInt(b.dataset.rest), getExercise(b.dataset.exid).name)));
  wrap.querySelectorAll('[data-action="save"]').forEach(b=>b.addEventListener('click', ()=>saveSet(b.dataset.exid, b.closest('.card'))));
}

function saveSet(exId, cardEl){
  const setNum = parseInt(cardEl.querySelector('.setNum').value) || 1;
  const weight = parseFloat(cardEl.querySelector('.weightInput').value);
  const reps = parseInt(cardEl.querySelector('.repsInput').value);
  if(isNaN(weight) || isNaN(reps)){ alert('Enter both weight and reps.'); return; }
  const today = new Date().toISOString().slice(0,10);
  if(!data.logs[exId]) data.logs[exId] = [];
  data.logs[exId].push({ date: today, set: setNum, weight, reps });
  saveData();
  cardEl.querySelector('.weightInput').value = '';
  cardEl.querySelector('.repsInput').value = '';
  cardEl.querySelector('.setNum').value = setNum + 1;
  renderWorkoutView();
}

/* ---------------- VIDEO MODAL ---------------- */
function openVideo(exId){
  const ex = getExercise(exId);
  const content = document.getElementById('videoContent');
  if(ex.videoId){
    content.innerHTML = `<iframe src="${yt(ex.videoId)}" allowfullscreen title="${ex.name} tutorial"></iframe>
      <a class="fallback-link" href="${ytSearch(ex.name)}" target="_blank" rel="noopener">Search more videos on YouTube ↗</a>`;
  } else {
    content.innerHTML = `<p style="text-align:center;color:var(--muted);padding:20px;">No embedded video yet for this exercise.</p>
      <a class="fallback-link" href="${ytSearch(ex.searchQ || ex.name)}" target="_blank" rel="noopener">🔍 Search "${ex.name}" tutorials on YouTube ↗</a>`;
  }
  document.getElementById('videoModal').classList.add('show');
}
document.getElementById('videoModalClose').addEventListener('click', ()=>{
  document.getElementById('videoModal').classList.remove('show');
  document.getElementById('videoContent').innerHTML = '';
});

/* ---------------- REST TIMER ---------------- */
let timerSeconds = 90;
let timerRemaining = 90;
let timerInterval = null;
let timerRunning = false;

function fmtTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function openTimer(seconds, label){
  timerSeconds = seconds;
  timerRemaining = seconds;
  timerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerLabel').textContent = `Rest: ${label}`;
  document.getElementById('timerDisplay').textContent = fmtTime(timerRemaining);
  document.getElementById('timerStartPause').textContent = 'Start';
  document.getElementById('timerWidget').classList.add('show');
}
function tick(){
  timerRemaining--;
  document.getElementById('timerDisplay').textContent = fmtTime(Math.max(timerRemaining,0));
  if(timerRemaining <= 0){
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timerStartPause').textContent = 'Start';
    document.getElementById('timerDisplay').textContent = "Go! 💪";
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]); }catch(e){}
    try{
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      osc.type='sine'; osc.frequency.value=880;
      osc.connect(audioCtx.destination);
      osc.start(); setTimeout(()=>osc.stop(), 350);
    }catch(e){}
    if(Notification && Notification.permission === 'granted'){
      new Notification('Rest complete', { body: 'Time for your next set!' });
    }
  }
}
document.getElementById('timerStartPause').addEventListener('click', ()=>{
  if(timerRunning){
    clearInterval(timerInterval); timerRunning = false;
    document.getElementById('timerStartPause').textContent = 'Start';
  } else {
    if(timerRemaining <= 0) timerRemaining = timerSeconds;
    timerRunning = true;
    document.getElementById('timerStartPause').textContent = 'Pause';
    if(Notification && Notification.permission === 'default') Notification.requestPermission();
    timerInterval = setInterval(tick, 1000);
  }
});
document.getElementById('timerPlus').addEventListener('click', ()=>{
  timerRemaining += 15; timerSeconds += 15;
  document.getElementById('timerDisplay').textContent = fmtTime(timerRemaining);
});
document.getElementById('timerMinus').addEventListener('click', ()=>{
  timerRemaining = Math.max(0, timerRemaining - 15);
  document.getElementById('timerDisplay').textContent = fmtTime(timerRemaining);
});
document.getElementById('timerClose').addEventListener('click', ()=>{
  clearInterval(timerInterval); timerRunning = false;
  document.getElementById('timerWidget').classList.remove('show');
});

/* ---------------- PROGRESS VIEW ---------------- */
let progressChart = null;
function renderProgressView(){
  const sel = document.getElementById('progressExerciseSelect');
  const prev = sel.value;
  sel.innerHTML = allExercises().map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  if(prev && allExercises().some(e=>e.id===prev)) sel.value = prev;
  drawProgressChart();
  renderHistoryTable();
}
document.getElementById('progressExerciseSelect').addEventListener('change', ()=>{ drawProgressChart(); renderHistoryTable(); });

function drawProgressChart(){
  const exId = document.getElementById('progressExerciseSelect').value;
  const ex = getExercise(exId);
  const logs = getLogs(exId);
  const statsEl = document.getElementById('progressStats');
  if(!ex || logs.length===0){
    if(progressChart) progressChart.destroy();
    statsEl.innerHTML = '<div class="empty">No data logged yet.</div>';
    return;
  }
  const byDate = {};
  logs.forEach(l=>{ if(!byDate[l.date] || l.weight > byDate[l.date]) byDate[l.date] = l.weight; });
  const dates = Object.keys(byDate).sort();
  const weights = dates.map(d=>byDate[d]);
  const est1RM = Math.max(...logs.map(l=>l.weight*(1+l.reps/30))).toFixed(1);
  const change = (weights[weights.length-1]-weights[0]).toFixed(1);

  statsEl.innerHTML = `
    <div>Sessions<b>${dates.length}</b></div>
    <div>Top weight<b>${Math.max(...weights)} kg</b></div>
    <div>Change<b style="color:${change>=0?'#33d69f':'#ff5c7a'}">${change>=0?'+':''}${change} kg</b></div>
    <div>Est. 1RM<b>${est1RM} kg</b></div>`;

  const ctx = document.getElementById('progressChart').getContext('2d');
  if(progressChart) progressChart.destroy();
  progressChart = new Chart(ctx, {
    type:'line',
    data:{ labels: dates, datasets:[{ label: ex.name + ' — top weight (kg)', data: weights,
      borderColor:'#4f8cff', backgroundColor:'rgba(79,140,255,0.15)', tension:.25, fill:true,
      pointRadius:4, pointBackgroundColor:'#4f8cff' }]},
    options:{ responsive:true, plugins:{legend:{labels:{color:'#e8eaf0'}}},
      scales:{ x:{ticks:{color:'#8a8fa3'},grid:{color:'#2a2e3d'}}, y:{ticks:{color:'#8a8fa3'},grid:{color:'#2a2e3d'}} } }
  });
}

function renderHistoryTable(){
  const exId = document.getElementById('progressExerciseSelect').value;
  const logs = getLogs(exId).slice().sort((a,b)=> b.date.localeCompare(a.date) || b.set-a.set);
  const wrap = document.getElementById('historyTableWrap');
  if(logs.length===0){ wrap.innerHTML = '<div class="empty">No logs yet.</div>'; return; }
  wrap.innerHTML = `<table class="full"><tr><th>Date</th><th>Set</th><th>Weight</th><th>Reps</th></tr>` +
    logs.map(l=>`<tr><td>${l.date}</td><td>${l.set}</td><td>${l.weight} kg</td><td>${l.reps}</td></tr>`).join('') + `</table>`;
}

/* ---------------- MANAGE VIEW ---------------- */
function renderManageView(){
  const daySel = document.getElementById('newExDay');
  daySel.innerHTML = `
    <option value="upperB">Monday · Upper B</option>
    <option value="lowerA">Tuesday · Lower A</option>
    <option value="upperA">Thursday · Upper A</option>
    <option value="lowerB">Friday · Lower B</option>`;

  const wrap = document.getElementById('exerciseManageList');
  const dayLabels = {upperB:"Upper B (Mon)", lowerA:"Lower A (Tue)", upperA:"Upper A (Thu)", lowerB:"Lower B (Fri)"};
  const byDay = {};
  allExercises().forEach(e=>{ (byDay[e.day] = byDay[e.day]||[]).push(e); });
  wrap.innerHTML = Object.keys(dayLabels).map(dk=>{
    const exs = byDay[dk] || [];
    if(exs.length===0) return '';
    return `<h3 style="font-size:.85rem;color:var(--muted);margin:14px 0 4px;">${dayLabels[dk]}</h3>` +
      exs.map(ex=>`
      <div class="exercise-list-item">
        <div>
          <div>${ex.name}</div>
          <div class="meta">${getLogs(ex.id).length} sets logged ${ex.customFlag ? ' · custom' : ''}</div>
        </div>
        ${ex.customFlag ? `<button class="danger-btn" onclick="deleteCustomExercise('${ex.id}')">Delete</button>` : ''}
      </div>`).join('');
  }).join('');
}

document.getElementById('addExBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newExName').value.trim();
  const day = document.getElementById('newExDay').value;
  const target = document.getElementById('newExTarget').value.trim() || '3 sets x 10-12 reps';
  const rest = parseInt(document.getElementById('newExRest').value) || 60;
  if(!name){ alert('Enter an exercise name.'); return; }
  const id = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_') + '_' + Date.now();
  data.customExercises.push({ id, name, day, rest, target, searchQ: name, customFlag: true });
  saveData();
  document.getElementById('newExName').value = '';
  document.getElementById('newExTarget').value = '';
  renderManageView();
  renderWorkoutView();
});

function deleteCustomExercise(id){
  if(!confirm('Delete this exercise and its logged data?')) return;
  data.customExercises = data.customExercises.filter(e=>e.id!==id);
  delete data.logs[id];
  saveData();
  renderManageView();
  renderWorkoutView();
}

document.getElementById('resetDataBtn').addEventListener('click', ()=>{
  if(!confirm('This will erase ALL logged sets permanently. Continue?')) return;
  data.logs = {};
  saveData();
  renderWorkoutView(); renderManageView();
});

/* ---------------- PWA INSTALL ---------------- */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------- INIT ---------------- */
renderPhaseBanner();
renderDayTabs();
renderWorkoutView();
</script>
